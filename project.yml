name: OrdnerSchmal
options:
  bundleIdPrefix: de.fatih
  deploymentTarget:
    iOS: "16.0"

targets:
  OrdnerSchmal:
    type: application
    platform: iOS
    sources:
      - path: ios-native/OrdnerSchmal
        excludes:
          - Assets.xcassets
    resources:
      - path: index.html
      - path: ios-native/OrdnerSchmal/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fatih.ordnerschmal
        PRODUCT_NAME: Ordner Schmal
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ios-native/OrdnerSchmal/Info.plist
      properties:
        CFBundleDisplayName: Ordner Schmal
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
